# Install: uv sync && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # System shellcheck (not koalaman/shellcheck-precommit Docker) so CI/macOS
  # runners work without Docker. Install: brew/apt install shellcheck.
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -x
        language: system
        files: ^(bin|lib|scripts)/
      - id: bats
        name: bats (pre-push)
        entry: bash -c 'command -v bats >/dev/null && bats tests/ || echo "bats not installed; skip pre-push hook"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -i=2, -ci]
        files: ^(bin|lib|scripts|tests)/
